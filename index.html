<style>
/* Layout: una columna de trabajo (Radar · Guion · Ajustes); la recomendación del día va en una franja roja y amarilla, como una miniatura del canal. */
:root{
  --bg:#F6F4F3; --surface:#FFFFFF; --sunk:#EFEBEA; --ink:#1F1719; --muted:#6B5D60; --line:#E1D9D9;
  --accent:#B5122B; --accent-ink:#FFFFFF; --gold:#E8B10E; --gold-ink:#2A1F00;
  --ok:#1F7A4D; --warn:#9A5B00; --bad:#B5122B;
  --font-display:"Anton",Impact,"Arial Narrow Bold",sans-serif;
  --font-ui:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141011; --surface:#1E1819; --sunk:#181314; --ink:#F2EAEA; --muted:#A8989B; --line:#3A2F31;
  --accent:#F0475C; --accent-ink:#1A0508; --gold:#F2C230; --gold-ink:#241A00;
  --ok:#5CC48C; --warn:#E3A43C; --bad:#F0475C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141011; --surface:#1E1819; --sunk:#181314; --ink:#F2EAEA; --muted:#A8989B; --line:#3A2F31;
  --accent:#F0475C; --accent-ink:#1A0508; --gold:#F2C230; --gold-ink:#241A00;
  --ok:#5CC48C; --warn:#E3A43C; --bad:#F0475C; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{font-family:var(--font-display);font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent);font-weight:400}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{font:600 14px var(--font-ui);background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.conn{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.pill{font:500 12px var(--font-ui);padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{border-color:var(--ok);color:var(--ok)}
.pill.off{border-color:var(--bad);color:var(--bad)}
main{padding-block:20px 60px}
h1,h2,h3{text-wrap:balance;margin:0}
h2.sec{font-family:var(--font-display);font-weight:400;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.eyebrow{font:600 11px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{font:600 14px var(--font-ui);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{font-size:13px;padding:5px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=text],textarea,select{font:15px var(--font-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font:600 13px var(--font-ui);color:var(--muted)}
/* franja de recomendación */
.hoy{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:center}
.hoy .k{font-family:var(--font-display);font-size:14px;letter-spacing:.14em;color:var(--gold)}
.hoy .n{font-family:var(--font-display);font-size:clamp(28px,6vw,46px);line-height:1;text-transform:uppercase;margin-top:4px}
.hoy .n em{font-style:normal;color:var(--gold)}
.hoy p{margin:8px 0 0;max-width:62ch;opacity:.95}
.hoy .btn{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.hoy.idle{background:var(--sunk);color:var(--ink);border:1px dashed var(--line)}
.hoy.idle .k{color:var(--muted)}
@media (max-width:560px){.hoy{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;min-width:0}
.card .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.card .m{font-size:13px;color:var(--muted);grid-column:1;overflow-wrap:anywhere}
.card .a{grid-row:1/span 3;grid-column:2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.card a{color:inherit}
.score{font:500 13px var(--font-mono);font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px;background:var(--gold);color:var(--gold-ink)}
.tag{font:600 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.tag.hot{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:8px}
.err{color:var(--bad);font-size:14px}
.log{font:13px var(--font-mono);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.steps{counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.step-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.step-h .num{font-family:var(--font-display);font-size:28px;line-height:1;color:var(--accent)}
.step-h h3{font:700 18px var(--font-ui)}
.step.locked{opacity:.55}
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.prop{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop[aria-checked="true"]{border-color:var(--accent)}
.prop .pt{font-weight:700;overflow-wrap:anywhere}
.prop .thumb{font-family:var(--font-display);text-transform:uppercase;font-size:17px;line-height:1.1;background:var(--accent);color:var(--accent-ink);padding:8px 10px;border-radius:6px}
.prop .thumb span{color:var(--gold)}
.prop .m{font-size:13px;color:var(--muted)}
.blk{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.blk:first-child{border-top:0;margin-top:0;padding-top:0}
.blk textarea{font:16px/1.65 var(--font-read);min-height:160px;background:var(--surface)}
.count{font:13px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.count.ok{color:var(--ok)} .count.warn{color:var(--warn)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{font:500 12px var(--font-ui);padding:4px 9px;border-radius:999px;border:1px solid var(--line)}
.chk.ok{border-color:var(--ok);color:var(--ok)} .chk.warn{border-color:var(--warn);color:var(--warn)} .chk.bad{border-color:var(--bad);color:var(--bad)}
.md{font-size:15px;line-height:1.6;max-width:78ch;overflow-wrap:anywhere}
.md h2{font:700 17px var(--font-ui);margin:18px 0 6px} .md h3{font:700 15px var(--font-ui);margin:14px 0 4px}
.md p{margin:6px 0} .md ul{margin:6px 0;padding-left:20px}
.md pre{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font:13px/1.5 var(--font-mono);white-space:pre-wrap}
.md .tw{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:13px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.md th{background:var(--sunk)}
.out{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:min(90vw,520px)}
.busy{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.busy::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);animation:p 1s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.busy::before{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:999px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.prompted textarea{font:13px/1.5 var(--font-mono);min-height:340px}
details>summary{cursor:pointer;font-weight:600}
</style>

<script>
"use strict";
const NEX = "Nexlev", PS = "Parallel Search";
const SID = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
const HOY = new Date().toISOString().slice(0, 10);
const DEFAULT_CHANNELS = [
  { handle: "@LaVerdaddelosFamososBH", id: "UCADCn9m1roqeGusmFK5Kx5A", title: "La Verdad de los Famosos" },
  { handle: "@famaycenizas", id: "UCw-NIV6AqR16RdDZ8jsAZtA", title: "Fama y Cenizas" },
  { handle: "@traselaplauso", id: "UCitSFeVPjKfm_kGvo3C7DfA", title: "Tras el Aplauso" },
  { handle: "@tutorialesgerberin", id: "UC4rDAt6XEQx3pPDJzNw5fJg", title: "tutorialesgerberin" },
];
const DEFAULT_CUBIERTOS = ["Adela Noriega","Elba Esther Gordillo","Jacobo Zabludovsky","Cristina Pacheco","Sasha Montenegro","Ana María Polo","Jenni Rivera","Angélica Rivera","Mónica Pretelini","Marcela Basteri","José José","El Puma (José Luis Rodríguez)","Silvia Pinal","Frida Sofía","Emilio Lozoya","Rocío Dúrcal","Beatriz Gutiérrez Müller","Karla Luna","Karla Panini","Bronco","Ramiro Delgado","Christian Bach","Humberto Zurita","Juan Gabriel","La India María","Niurka Marcos","Galilea Montijo","Pati Chapoy"];
const PROMPT_FILES = { guion: "prompts/guion.txt", packaging: "prompts/packaging.txt", memoria: "prompts/memoria.txt", antiia: "prompts/anti-ia.txt" };
const PROMPT_NAMES = { guion: "Guion (Mujeres de Poder)", packaging: "Packaging", memoria: "Memoria del canal", antiia: "Reglas anti-IA" };
const ORD = ["primero", "segundo", "tercero", "cuarto"];
const CANALES = ["MUJERES DE PODER", "LA FAMA COBRA", "LA VERDAD DEL FAMOSO"];

const S = {
  view: "radar",
  cfg: { channels: DEFAULT_CHANNELS.slice(), cubiertos: DEFAULT_CUBIERTOS.slice(), prompts: {}, calidad: "complex" },
  defaults: {},
  projects: [],
  proj: null,
  radar: { newsState: "idle", news: null, newsErr: "", outState: "idle", outliers: [], outErr: [], hoy: null },
  busy: null, log: "", promptSel: "guion",
};
let sample = null, mcp = null, db = null, downloads = null, uid = null, ctl = null, toolsOk = false;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("es-ES");
const nowTs = () => Date.now();
function toast(msg, ms = 3200) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms); }
function titleCase(s) { return String(s).toLowerCase().replace(/(^|[\s'"(¿¡-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()); }
function daysAgo(d) { const t = Date.parse(d); return isNaN(t) ? null : Math.round((Date.now() - t) / 864e5); }
function P(k) { return (S.cfg.prompts && S.cfg.prompts[k]) || S.defaults[k] || ""; }
function tier() { return S.cfg.calidad === "default" ? "default" : "complex"; }
function use(n) { try { return window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null); } catch { return Promise.resolve(null); } }

function payloadOf(r) {
  let p = r && r.payload;
  if (p == null) { const t = r && r.content && r.content.find && r.content.find(c => c.type === "text"); p = t ? t.text : null; }
  for (let i = 0; i < 2 && typeof p === "string"; i++) { try { p = JSON.parse(p); } catch { break; } }
  return p;
}
function mcpMsg(e, server) {
  const s = (e && e.server) || server;
  switch (e && e.code) {
    case "server_not_connected": return `Conecta ${s} en claude.ai → Ajustes → Conectores.`;
    case "needs_reauth": return `Vuelve a conectar ${s} en claude.ai → Ajustes → Conectores.`;
    case "selection_required": return `Elige qué conector ${s} usar en el aviso de claude.ai.`;
    case "not_in_manifest": return `No has permitido ${s} en esta app. Actívalo en el menú de permisos de la página.`;
    case "approval_required": return `${s} necesita tu aprobación. Vuelve a pulsar el botón y acepta.`;
    case "blocked_by_policy": return `Tu organización bloquea ${s}.`;
    case "server_unavailable": return `${s} no responde ahora mismo. Prueba en unos minutos.`;
    case "tool_error": return `${s} devolvió un error: ${String(e.message || "").slice(0, 160)}`;
    case "cancelled": return "Detenido.";
    default: return `No se pudo usar ${s}${e && e.code ? " (" + e.code + ")" : ""}.`;
  }
}
function sampleMsg(e) {
  switch (e && e.code) {
    case "not_granted": return "No has permitido que la app use Claude. Recarga la página y acepta el permiso.";
    case "sampling_disabled": return "Claude no está disponible en esta cuenta.";
    case "rate_limited": return "Has llegado al límite de uso de Claude por ahora. Prueba más tarde.";
    case "session_expired": return "Tu sesión caducó. Vuelve a iniciar sesión en claude.ai.";
    case "refused": return "Claude no quiso escribir esto. Cambia el enfoque o la nota e inténtalo de nuevo.";
    case "prompt_too_large": return "El texto enviado es demasiado largo. Acorta el dossier o la referencia.";
    case "invalid_json": return "La respuesta llegó con un formato que la app no entiende. Pulsa otra vez.";
    case "empty_completion": return "Claude no devolvió texto. Pulsa otra vez.";
    case "cancelled": return "Detenido.";
    case "tools_unavailable": return "Esta vista no permite que Claude busque en la web.";
    default: return "Se cortó la conexión con Claude. Pulsa otra vez.";
  }
}
const MCP_CODES = new Set(["needs_reauth", "server_not_connected", "selection_required", "server_not_found", "server_unavailable", "not_in_manifest", "blocked_by_policy", "approval_required", "tool_error", "bad_request"]);
const errMsg = (e, server) => e && (e.server || MCP_CODES.has(e.code)) ? mcpMsg(e, server) : sampleMsg(e);
async function callMcp(server, tool, input, cacheMs, signal, refresh) {
  if (!mcp) throw { code: "capability_disabled", server };
  const opts = {};
  if (cacheMs) opts.cache = { staleTime: cacheMs, gcTime: cacheMs, refresh: !!refresh };
  if (signal) opts.signal = signal;
  return payloadOf(await mcp.callTool(server, tool, input, opts));
}
async function searchWeb(objective, queries, signal, refresh) {
  const p = await callMcp(PS, "web_search", { objective, search_queries: queries, session_id: SID }, 3 * 3600e3, signal, refresh);
  return ((p && p.results) || []).map(x => ({ url: x.url, title: x.title || "", date: x.publish_date || "", text: (x.excerpts || []).join(" … ").replace(/\s+/g, " ").slice(0, 900) }));
}
function fmtResults(items, max) {
  let out = "";
  for (const r of items) { const s = `• ${r.title}${r.date ? " (" + r.date + ")" : ""}\n  ${r.url}\n  ${r.text}\n`; if (out.length + s.length > max) break; out += s; }
  return out;
}
async function save(filename, data) {
  if (downloads) {
    try { await downloads.save({ filename, data }); return; }
    catch (e) { if (e && (e.code === "declined" || e.code === "rate_limited")) return; }
  }
  try { await navigator.clipboard.writeText(data); toast("No se pudo descargar; lo he copiado al portapapeles."); }
  catch { toast("No se pudo descargar ni copiar en esta vista."); }
}
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label + " copiado."); } catch { toast("Esta vista no deja copiar. Selecciona el texto a mano."); }
}
function setBusy(label) { S.busy = label; render(); }
function logLine(s) { S.log += (S.log ? "\n" : "") + s; const l = $("#log"); if (l) l.textContent = S.log; }
function newCtl() { ctl = new AbortController(); return ctl.signal; }
function stop() { if (ctl) ctl.abort(); }

/* ---------- guardado ---------- */
let chain = Promise.resolve();
function enqueue(fn) { chain = chain.then(fn).catch(e => { console.warn(e); toast("No se pudo guardar el último cambio."); }); return chain; }
const cfgDoc = () => db.doc(`data/users/${uid}/config`);
const projCol = () => cfgDoc().collection("proyectos");
function saveCfg() { if (!db) return; const c = JSON.parse(JSON.stringify(S.cfg)); enqueue(() => cfgDoc().set(c)); }
function saveProj() {
  if (!S.proj) return;
  S.proj.actualizado = nowTs();
  const i = S.projects.findIndex(p => p.id === S.proj.id);
  const summary = { id: S.proj.id, famoso: S.proj.famoso, actualizado: S.proj.actualizado, estado: projState(S.proj) };
  if (i >= 0) S.projects[i] = summary; else S.projects.unshift(summary);
  if (!db) return;
  const data = JSON.parse(JSON.stringify(S.proj));
  if (JSON.stringify(data).length > 230000) { data.referencia = (data.referencia || "").slice(0, 6000); data.dossier = (data.dossier || "").slice(0, 10000); }
  const id = S.proj.id;
  enqueue(() => projCol().doc(id).set(data));
}
async function loadCfg() {
  try {
    const snap = await cfgDoc().get();
    if (snap.exists) { const d = snap.data() || {}; S.cfg = Object.assign(S.cfg, d); if (!Array.isArray(S.cfg.channels)) S.cfg.channels = DEFAULT_CHANNELS.slice(); if (!Array.isArray(S.cfg.cubiertos)) S.cfg.cubiertos = DEFAULT_CUBIERTOS.slice(); S.cfg.prompts = S.cfg.prompts || {}; }
  } catch (e) { console.warn(e); toast("No pude leer tus ajustes guardados; uso los de serie."); }
}
async function loadProjects() {
  try {
    const q = await projCol().orderBy("actualizado", "desc").limit(40).get();
    S.projects = q.docs.map(d => { const x = d.data() || {}; return { id: d.id, famoso: x.famoso, actualizado: x.actualizado, estado: projState(x) }; });
  } catch (e) { console.warn(e); }
}
async function openProject(id) {
  if (!db) return;
  try { const s = await projCol().doc(id).get(); if (s.exists) { S.proj = Object.assign(blankProj(), s.data()); S.proj.id = id; go("guion"); } }
  catch { toast("No pude abrir ese guion."); }
}
function projState(p) {
  if (!p) return "";
  if (p.packaging) return "Packaging listo";
  const n = (p.bloques || []).filter(b => b && b.length > 2000).length;
  if (n) return `Guion ${n}/5 bloques`;
  if (p.propuestas && p.propuestas.length) return "Propuestas listas";
  return "Tema elegido";
}

/* ---------- proyecto ---------- */
function blankProj() {
  return { id: "", creado: nowTs(), actualizado: nowTs(), tipo: "manual", famoso: "", origen: {}, dossier: "", referencia: "", angRef: "", propuestas: [], eleccion: { idx: null, notas: "", pantalla: "" }, nombreCorto: "", canal: "", plan: null, bloques: ["", "", "", "", ""], auditoria: "", analisis: "", packaging: "" };
}
function newProject(tipo, famoso, origen) {
  const p = blankProj();
  p.id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  p.tipo = tipo; p.famoso = famoso || ""; p.origen = origen || {};
  p.nombreCorto = (famoso || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, "").trim();
  S.proj = p; S.log = ""; saveProj(); go("guion");
}

/* ---------- radar ---------- */
async function runRadar(force) {
  runNews(force); runOutliers(force);
}
async function runNews(force) {
  const R = S.radar;
  if (!mcp) { R.newsState = "error"; R.newsErr = "Esta vista no puede usar conectores."; render(); return; }
  R.newsState = "loading"; R.newsErr = ""; render();
  try {
    const [a, b] = await Promise.all([
      searchWeb("Noticias de los últimos días sobre famosos del espectáculo mexicano: fallecimientos, hospitalizaciones, herencias, testamentos, pleitos familiares, demandas y revelaciones", ["muere actor mexicano", "fallece actriz mexicana", "herencia famoso mexicano pleito", "testamento cantante mexicano hijos"], null, force),
      searchWeb("Noticias recientes que son tendencia sobre figuras de la época de oro del cine mexicano, telenovelas clásicas, cantantes de los 70 y 80 y presentadores de la televisión mexicana", ["época de oro cine mexicano noticia", "actriz de telenovela clásica hoy", "presentador televisión mexicana polémica", "Ventaneando famosos hoy"], null, force),
    ]);
    const seen = new Set(), items = [];
    for (const r of [...a, ...b]) { if (!r.url || seen.has(r.url)) continue; seen.add(r.url); items.push(r); }
    if (!items.length) { R.news = { hay_tendencia: false, candidatos: [] }; R.newsState = "done"; pickHoy(); render(); return; }
    if (!sample) { R.newsState = "error"; R.newsErr = "Esta vista no puede usar Claude para filtrar las noticias."; render(); return; }
    const prompt = `Hoy es ${HOY}. Trabajas para un canal de YouTube de documentales biográficos sobre famosos del espectáculo mexicano (cine de oro, telenovelas, cantantes, presentadores de televisión de antes y de ahora). Audiencia: mujeres de 60 a 75 años.

Estos son resultados de búsqueda de noticias:
${fmtResults(items, 20000)}

Famosos que el canal ya cubrió (márcalos con ya_cubierto=true si salen, pero no los descartes):
${S.cfg.cubiertos.join(", ")}

TAREA: elige como máximo 8 personas que sean noticia AHORA (noticia de los últimos 21 días según las fechas de los resultados) y que encajen en el canal. Descarta deportistas, políticos sin carrera en el espectáculo, famosos extranjeros sin relación con México y noticias sin fecha reciente. "fuerza" de 1 a 5 = potencial para esta audiencia (fallecimiento, herencia, pleito familiar, revelación íntima de alguien muy reconocido = 5). hay_tendencia = true solo si al menos un candidato tiene fuerza 4 o 5 y noticia de los últimos 10 días. No inventes nada que no esté en los resultados.

Responde solo con JSON con esta forma:
{"hay_tendencia":true,"candidatos":[{"nombre":"Nombre Completo","que_paso":"una frase con el hecho de la noticia","por_que_engancha":"una frase","fecha":"AAAA-MM-DD","url":"https://...","fuerza":5,"ya_cubierto":false}]}`;
    const out = await sample.json(prompt, { modelTier: "default", cache: { gcTime: 3 * 3600e3, refresh: !!force } });
    R.news = { hay_tendencia: !!(out && out.hay_tendencia), candidatos: (out && Array.isArray(out.candidatos) ? out.candidatos : []).filter(c => c && c.nombre).sort((x, y) => (y.fuerza || 0) - (x.fuerza || 0)) };
    R.newsState = "done";
  } catch (e) {
    R.newsState = "error"; R.newsErr = e && e.code ? errMsg(e, PS) : "No se pudieron buscar noticias.";
  }
  pickHoy(); render();
}
async function runOutliers() {
  const R = S.radar;
  if (!mcp) { R.outState = "error"; R.outErr = ["Esta vista no puede usar conectores."]; render(); return; }
  R.outState = "loading"; R.outErr = []; render();
  const res = await Promise.all(S.cfg.channels.map(async ch => {
    try {
      const p = await callMcp(NEX, "youtube_channel_outliers", { channel_id: ch.id, max_videos: 60, min_outlier_threshold: 2 }, 12 * 3600e3);
      return ((p && p.outliers) || []).map(v => ({ videoId: v.videoId, titulo: v.title, vistas: Number(v.viewCount) || 0, fecha: v.publishDate || "", ratio: Number(v.viewRatio) || parseFloat(v.outlierScore) || 0, duracion: v.lengthText || "", canal: ch.title || ch.handle }));
    } catch (e) { R.outErr.push(`${ch.title || ch.handle}: ${mcpMsg(e, NEX)}`); return []; }
  }));
  R.outliers = res.flat().sort((a, b) => b.ratio - a.ratio);
  R.outState = "done"; pickHoy(); render();
}
function coveredIn(text) {
  const t = String(text || "").toLowerCase();
  return S.cfg.cubiertos.find(c => { const k = c.toLowerCase().replace(/\(.*?\)/g, "").trim(); return k.length > 3 && t.includes(k); }) || null;
}
function famosoFromTitle(t) { const s = String(t || "").split(/[:|]/)[0].trim(); return s.length > 2 && s.length < 60 ? titleCase(s) : ""; }
function pickHoy() {
  const R = S.radar; R.hoy = null;
  const c = R.news && R.news.hay_tendencia && R.news.candidatos.find(x => !x.ya_cubierto) || (R.news && R.news.hay_tendencia && R.news.candidatos[0]);
  if (c) { R.hoy = { tipo: "noticia", c }; return; }
  if (R.outState !== "done" && R.newsState !== "error") return;
  const pool = R.outliers.filter(v => !coveredIn(v.titulo));
  const recent = pool.filter(v => { const d = daysAgo(v.fecha); return d != null && d <= 90; });
  const v = (recent[0] || pool[0] || R.outliers[0]);
  if (v) R.hoy = { tipo: "outlier", v };
}
function startFromNews(c) {
  newProject("noticia", c.nombre, { nombre: c.nombre, que_paso: c.que_paso, por_que: c.por_que_engancha, fecha: c.fecha, url: c.url });
}
function startFromOutlier(v) {
  newProject("outlier", famosoFromTitle(v.titulo), { videoId: v.videoId, titulo: v.titulo, canal: v.canal, vistas: v.vistas, ratio: v.ratio, fecha: v.fecha });
}

async function writeBlock(n, note, cont, sig) {
  const p = S.proj;
  const base = cont ? p.bloques[n - 1] : "";
  const ta = document.getElementById("b" + n);
  const r = await sample(baseCtx(true) + blockTask(n, note, cont), {
    modelTier: tier(), signal: sig, cache: false,
    onText: ({ text }) => { const v = cont ? base + "\n\n" + text : text; if (ta) { ta.value = v; } const c = document.getElementById("bc" + n); if (c) c.textContent = fmt(v.length) + " caracteres"; },
  });
  p.bloques[n - 1] = cont ? base + "\n\n" + cleanBlock(r.text) : cleanBlock(r.text);
  saveProj();
  return r.truncated;
}

function fullScript() { return S.proj.bloques.filter(Boolean).join("\n\n"); }
const PROHIBIDAS = ["cabe destacar", "es importante señalar", "resulta fascinante", "sin lugar a dudas", "tapiz", "un testimonio de", "un claro ejemplo de", "papel crucial", "papel fundamental", "se erige", "se alza como", "en este sentido", "en este contexto", "dicho esto", "holístico", "paradigma", "sinergia", "transformador", "en un mundo donde", "en conclusión", "en resumen", "como hemos visto", "lo cierto es que", "podría decirse", "en cierto modo", "navegar por"];
function localChecks(t, plan) {
  const out = [];
  const sinP = t.replace(/<#[\d.]+#>/g, "");
  const n = t.length, n2 = sinP.length;
  out.push([n >= 70000 && n <= 82000 ? "ok" : n >= 60000 ? "warn" : "bad", `${fmt(n)} caracteres (${fmt(n2)} sin pausas)`]);
  const dash = (t.match(/—/g) || []).length; out.push([dash ? "bad" : "ok", dash ? `${dash} rayas largas` : "Sin rayas largas"]);
  const dig = (sinP.match(/\d/g) || []).length; out.push([dig ? "warn" : "ok", dig ? `${dig} cifras en número` : "Cifras en letras"]);
  const bold = (t.match(/\*\*/g) || []).length; out.push([bold % 2 ? "bad" : "ok", bold % 2 ? "Negritas ** desparejadas" : "Negritas parejas"]);
  const html = (t.match(/<(?!#)[^>\n]{1,40}>/g) || []).length; out.push([html ? "bad" : "ok", html ? `${html} etiquetas sueltas` : "Sin etiquetas"]);
  const anti = t.match(/\b(no es|no era|no se trataba|esto no es|no fue)\b[^.!?\n]{1,70}[.;,]\s*(es|era|fue|se trataba)\b/gi) || [];
  out.push([anti.length ? "bad" : "ok", anti.length ? `${anti.length} posibles "No es X, es Y"` : "Sin antítesis binaria"]);
  const low = t.toLowerCase(); const pro = PROHIBIDAS.filter(w => low.includes(w));
  out.push([pro.length ? "warn" : "ok", pro.length ? "Vocabulario IA: " + pro.join(", ") : "Sin vocabulario IA"]);
  const miss = ORD.filter(o => !new RegExp("aqu[ií] viene lo " + o, "i").test(t));
  out.push([miss.length ? "warn" : "ok", miss.length ? "Faltan avisos de promesa: " + miss.join(", ") : "Las 4 promesas avisadas"]);
  if (plan && plan.frase_ancla) {
    const k = plan.frase_ancla.toLowerCase().replace(/[«»"“”.]/g, "").trim().split(/\s+/).slice(0, 6).join(" ");
    const c = k ? low.replace(/[«»"“”]/g, "").split(k).length - 1 : 0;
    out.push([c >= 3 ? "ok" : "warn", `Frase ancla ${c} veces`]);
  }
  out.push([/\bQR\b/.test(t) ? "ok" : "warn", /\bQR\b/.test(t) ? "CTA con QR" : "Falta la CTA del QR"]);
  return { items: out, anti };
}
